<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResidentQuant</title>
<meta name="description" content="ResidentQuant. Your analytics layer, built and run for you. Coming soon.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='17' width='6' height='11' rx='1.5' fill='%230e1525'/%3E%3Crect x='13' y='10' width='6' height='18' rx='1.5' fill='%230e1525'/%3E%3Crect x='22' y='3' width='6' height='25' rx='1.5' fill='%23d7263d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --ink: #0e1525; --muted: #586174; --faint: #8b93a3; --line: #e4e7ed;
    --accent: #d7263d; --accent-bg: #fbe5e8; --navy: #0a3069; --teal: #0d9488;
    --f-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #070a10; --ink: #e7ebf2; --muted: #9aa3b5; --faint: #6b7486; --line: #232b3b;
      --accent: #ff4d62; --accent-bg: #3a1520; --navy: #8fb0ff; --teal: #3cc9b6;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--f-body);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; text-align: center; -webkit-font-smoothing: antialiased;
  }
  .mark { display: flex; align-items: flex-end; gap: 7px; height: 56px; margin-bottom: 30px; }
  .mark span {
    width: 12px; border-radius: 3px; background: var(--ink);
    transform-origin: bottom; animation: rise 2.4s ease-in-out infinite;
  }
  .mark span:nth-child(1) { height: 44%; animation-delay: 0s; }
  .mark span:nth-child(2) { height: 72%; animation-delay: .2s; }
  .mark span:nth-child(3) { height: 100%; animation-delay: .4s; background: var(--accent); }
  @keyframes rise { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.55); } }
  .logo {
    font: 800 clamp(40px, 8vw, 72px)/1 var(--f-display); letter-spacing: -.035em;
  }
  .logo .q { color: var(--accent); }
  .tag {
    margin-top: 18px; font: 500 clamp(15px, 2.2vw, 18px)/1.5 var(--f-body); color: var(--muted);
  }
  .soon {
    display: inline-block; margin-top: 26px; padding: 6px 12px; border-radius: 999px;
    background: var(--accent-bg); color: var(--accent);
    font: 600 11.5px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase;
  }
  .soon::after { content: "_"; margin-left: 2px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .mark span, .soon::after { animation: none; } }
  footer {
    position: fixed; bottom: 20px; left: 0; right: 0;
    font: 500 11px/1 var(--f-mono); color: var(--faint); letter-spacing: .08em;
  }
</style>
</head>
<body>
  <div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
  <h1 class="logo">Resident<span class="q">Quant</span></h1>
  <p class="tag">Your analytics layer, built and run for you.</p>
  <p class="soon">Coming soon</p>
  <footer>&copy; 2026 ResidentQuant</footer>
</body>
</html>
