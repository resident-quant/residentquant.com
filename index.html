<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResidentQuant</title>
<meta name="description" content="ResidentQuant. Coming soon.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='18' width='6' height='10' rx='1.5' fill='%23111'/%3E%3Crect x='13' y='11' width='6' height='17' rx='1.5' fill='%23111'/%3E%3Crect x='22' y='4' width='6' height='24' rx='1.5' fill='%23111'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --ink: #111; --mute: #8a8f98; --line: #ececec; --bg: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f2f2f2; --mute: #8a8f98; --line: #222; --bg: #0b0b0c; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px; -webkit-font-smoothing: antialiased;
  }
  .mark { display: flex; align-items: flex-end; gap: 7px; height: 56px; margin-bottom: 32px; }
  .mark span {
    width: 12px; background: var(--ink); border-radius: 3px;
    transform-origin: bottom; animation: rise 2.4s ease-in-out infinite;
  }
  .mark span:nth-child(1) { height: 40%; animation-delay: 0s; }
  .mark span:nth-child(2) { height: 70%; animation-delay: .2s; }
  .mark span:nth-child(3) { height: 100%; animation-delay: .4s; }
  @keyframes rise { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.55); } }
  @media (prefers-reduced-motion: reduce) { .mark span { animation: none; } }
  h1 { font-weight: 600; font-size: clamp(36px, 7vw, 64px); letter-spacing: -0.035em; line-height: 1; }
  .soon {
    margin-top: 20px; font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--mute);
  }
  .soon::after { content: "_"; animation: blink 1.1s steps(1) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  footer {
    position: fixed; bottom: 20px; font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px; color: var(--mute); letter-spacing: .08em;
  }
</style>
</head>
<body>
  <div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
  <h1>ResidentQuant</h1>
  <p class="soon">Coming soon</p>
  <footer>&copy; 2026 ResidentQuant</footer>
</body>
</html>
